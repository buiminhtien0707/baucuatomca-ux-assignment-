<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bầu Cua Vui: học và chơi bầu cua tôm cá bằng xu ảo. Không nạp, không rút, chỉ để vui ngày Tết.">
  <title>BẦU CUA VUI: Home</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css?v=15">
  <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css?v=15">
  <link rel="stylesheet" href="css/pages.css?v=15">
</head>
<body data-page="home">
  <noscript><p style="padding:10px 16px;background:#E8442E;color:#FFFDF8;font-weight:700">Trang này cần JavaScript để chơi — hãy bật JS trong trình duyệt.</p></noscript>
  <a class="skip-link" href="#main">Đến nội dung chính</a>

  <nav class="bc-nav">
    <div class="inner">
      <a class="brand" href="index.html" data-i18n="brand.short"></a>
      <button class="nav-toggle" aria-label="Menu"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2.6"/></svg></button>
      <div class="bc-links">
        <a href="index.html" data-page="home" data-i18n="nav.home"></a>
        <a href="play.html" data-page="play" data-i18n="nav.play"></a>
        <a href="learn.html" data-page="learn" data-i18n="nav.learn"></a>
        <a href="lab.html" data-page="lab" data-i18n="nav.lab"></a>
        <a href="tet.html" data-page="tet" data-i18n="nav.tet"></a>
      </div>
      <div class="nav-tools">
        <div class="lang-group" role="group" aria-label="Language">
          <button data-lang="vn">VN</button>
          <button data-lang="en" class="active">EN</button>
          <button data-lang="zh">ZH</button>
        </div>
        <button class="icon-btn" data-act="sound" data-i18n-aria="a11y.sound"><svg class="ic-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg><svg class="ic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path d="M16 9l5 6M21 9l-5 6"/></svg></button>
        <button class="coin-pill" data-act="drawer-open" data-i18n-aria="a11y.coin"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#B8860B" stroke="#141414" stroke-width="2"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#141414" stroke-width="1.6"/></svg><span>1.000 xu</span></button>
        <button class="btn-bc btn-xs btn-red quick-lixi-btn" data-act="quick-lixi" data-i18n="nav.quickLixi" title="Nhận +500 xu vô cực" aria-label="Nhận +500 xu">+500 xu</button>
      </div>
    </div>
  </nav>

  <main id="main">
    <!-- hero -->
    <section class="hero hero-centered">
      <div class="hero-wrap">
        <!-- Left flank cards: Cua & Bao lì xì -->
        <div class="hero-flank flank-left" aria-hidden="true">
          <div class="pixel-card card-cua">
            <img src="assets/img/animals/cua.svg" alt="Cua" width="68" height="68">
          </div>
          <div class="pixel-card card-lixi">
            <img src="assets/img/lixi_pixel.svg" alt="Bao lì xì" width="64" height="64">
          </div>
        </div>

        <!-- Center content -->
        <div class="hero-center">
          <h1 class="hero-title">
            <span class="t-line-1" data-i18n="hero.t1"></span><br>
            <span class="hl-wrap">
              <span class="hl" data-i18n="hero.t2"></span>
            </span>
          </h1>

          <p class="lead" data-i18n="hero.sub"></p>

          <!-- Main CTAs -->
          <div class="cta hero-cta-group">
            <a class="btn-bc btn-gold" href="play.html" data-i18n="hero.ctaPlay"></a>
            <a class="btn-bc btn-ghost" href="#how-to-play" data-i18n="hero.ctaLearn"></a>
          </div>
        </div>

        <!-- Right flank cards: Cá & Xúc xắc pixel -->
        <div class="hero-flank flank-right" aria-hidden="true">
          <div class="pixel-card card-ca">
            <img src="assets/img/animals/ca.svg" alt="Cá" width="68" height="68">
          </div>
          <div class="pixel-card card-dice">
            <img src="assets/img/dice_pixel.svg" alt="Xúc xắc" width="64" height="64">
          </div>
        </div>
      </div>
    </section>

    <!-- how it works -->
    <section class="section" id="how-to-play">
      <div class="section-head">
        <h2 class="section-title" data-i18n="how.title"></h2>
        <p class="section-desc" data-i18n="how.sub"></p>
      </div>
      <div class="row g-4">
        <div class="col-md-4">
          <div class="card-bc how-card" data-step="1">
            <div class="how-step-header">
              <span class="how-step-num">01</span>
              <span class="how-badge" data-i18n="how.step1Tag"></span>
            </div>
            <h3 data-i18n="how.1t"></h3>
            <p data-i18n="how.1d"></p>
            <div class="how-visual">
              <div class="how-chip-demo" role="group" aria-label="Chip selection demo">
                <button type="button" class="demo-chip" data-val="10">10</button>
                <button type="button" class="demo-chip" data-val="50">50</button>
                <button type="button" class="demo-chip active" data-val="100">100</button>
                <button type="button" class="demo-chip" data-val="500">500</button>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card-bc how-card" data-step="2">
            <div class="how-step-header">
              <span class="how-step-num">02</span>
              <span class="how-badge" data-i18n="how.step2Tag"></span>
            </div>
            <h3 data-i18n="how.2t"></h3>
            <p data-i18n="how.2d"></p>
            <div class="how-visual">
              <div class="how-cell-demo" role="button" tabindex="0">
                <div class="cell-info">
                  <img src="assets/img/animals/cua.svg" alt="Cua" width="38" height="38">
                  <span class="cell-label">CUA</span>
                </div>
                <span class="cell-bet-pill">+100 xu</span>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card-bc how-card" data-step="3">
            <div class="how-step-header">
              <span class="how-step-num">03</span>
              <span class="how-badge" data-i18n="how.step3Tag"></span>
            </div>
            <h3 data-i18n="how.3t"></h3>
            <p data-i18n="how.3d"></p>
            <div class="how-visual">
              <div class="how-dice-demo" role="button" tabindex="0">
                <div class="demo-dice-wrap">
                  <div class="demo-die"><img src="assets/img/animals/cua.svg" alt="Cua"></div>
                  <div class="demo-die"><img src="assets/img/animals/cua.svg" alt="Cua"></div>
                  <div class="demo-die"><img src="assets/img/animals/ca.svg" alt="Cá"></div>
                </div>
                <div class="demo-payout-pill" data-i18n="how.payoutDemo"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Quick summary banner -->
      <div class="how-summary-banner">
        <div class="summary-left">
          <strong class="summary-title" data-i18n="how.ruleSummaryTitle"></strong>
          <span class="summary-payouts" data-i18n="how.ruleSummaryDesc"></span>
        </div>
        <a href="play.html" class="btn-bc btn-red how-summary-btn" data-i18n="how.tryBtn"></a>
      </div>
    </section>

    <!-- animals -->
    <section class="section">
      <div class="section-head">
        <h2 class="section-title" data-i18n="animals.title"></h2>
        <p class="section-desc" data-i18n="animals.sub"></p>
      </div>
      <div class="carousel-wrap">
        <button class="car-btn prev" data-act="car-prev" aria-label="Previous"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M14 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3"/></svg></button>
        <div class="animal-track" id="animal-track"></div>
        <button class="car-btn next" data-act="car-next" aria-label="Next"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M10 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3"/></svg></button>
      </div>
    </section>

    <!-- faq -->
    <section class="section">
      <div class="section-head">
        <h2 class="section-title" data-i18n="faq.title"></h2>
        <p class="section-desc" data-i18n="faq.sub"></p>
      </div>
      <div id="faq-zone"></div>
    </section>
  </main>

  <footer class="bc-footer">
    <div class="inner">
      <div>
        <strong data-i18n="brand.full"></strong>
        <p class="fine" data-i18n="footer.blurb"></p>
      </div>
      <div class="fine">
        <p data-i18n="footer.warn"></p>
        <p data-i18n="footer.made"></p>
      </div>
      <div class="fine">
        <a href="index.html" data-i18n="nav.home"></a><br>
        <a href="play.html" data-i18n="nav.play"></a><br>
        <a href="learn.html" data-i18n="nav.learn"></a>
      </div>
    </div>
  </footer>

  <!-- animal detail modal -->
  <div class="modal-bc" id="modal-animal" role="dialog" aria-modal="true">
    <div class="box"></div>
  </div>

  <!-- Túi xu drawer -->
  <div class="drawer-backdrop"></div>
  <aside class="drawer" aria-label="Túi xu">
    <div class="close-row"><button class="icon-btn" data-act="drawer-close" aria-label="Close">✕</button></div>
    <h3><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 7c-3 2-5 5-5 8 0 4 4 6 9 6s9-2 9-6c0-3-2-6-5-8" fill="#E8442E" stroke="#141414" stroke-width="2"/><path d="M9 7c0-2 1.4-4 3-4s3 2 3 4" fill="none" stroke="#141414" stroke-width="2"/></svg> <span data-i18n="drawer.title"></span></h3>
    <button class="btn-bc btn-red" data-act="lixi" style="width:100%" data-i18n="drawer.lixi"></button>
    <h3 style="font-size:18px" data-i18n="drawer.badges"></h3>
    <div class="badge-grid" id="badge-grid"></div>
    <h3 style="font-size:18px" data-i18n="drawer.stats"></h3>
    <div id="drawer-stats" style="display:grid;gap:6px"></div>
    <button class="btn-bc btn-sm" data-act="reset" style="margin-top:14px" data-i18n="drawer.reset"></button>
  </aside>

  <button class="icon-btn fab" data-act="drawer-open" aria-label="Túi xu"
     style="position:fixed;bottom:18px;right:18px;z-index:150;width:56px;height:56px;border-radius:50%"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M8 7c-3 2-5 5-5 8 0 4 4 6 9 6s9-2 9-6c0-3-2-6-5-8" fill="#E8442E" stroke="#141414" stroke-width="2"/><path d="M9 7c0-2 1.4-4 3-4s3 2 3 4" fill="none" stroke="#141414" stroke-width="2"/></svg></button>
  <div class="toast-zone"></div>

  <script src="js/data-core.js?v=15"></script>
  <script src="js/data-content.js?v=15"></script>
  <script src="js/i18n-vn.js?v=15"></script>
  <script src="js/i18n-en.js?v=15"></script>
  <script src="js/i18n-zh.js?v=15"></script>
  <script src="js/i18n.js?v=15"></script>
  <script src="js/store.js?v=15"></script>
  <script src="js/audio.js?v=15"></script>
  <script src="js/wallet.js?v=15"></script>
  <script src="js/badges.js?v=15"></script>
  <script src="js/ui.js?v=15"></script>
  <script src="js/fx.js?v=15"></script>
  <script src="js/page-home.js?v=15"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      BCUI.boot();
      // reset data button (drawer)
      var resetBtn = document.querySelector("[data-act=reset]");
      if (resetBtn) resetBtn.addEventListener("click", function () {
        BCStore.reset();
        BCUI.toast(BCi18n.t("drawer.resetOk"));
        setTimeout(function () { location.reload(); }, 600);
      });
    });
  </script>
</body>
</html>
