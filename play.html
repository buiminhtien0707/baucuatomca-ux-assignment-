<!DOCTYPE html>
<html lang="vn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BẦU CUA VUI — Play</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="play">
  <a class="skip-link" href="#main">Đến nội dung chính</a>

  <nav class="bc-nav">
    <div class="inner">
      <a class="brand" href="index.html" data-i18n="brand.short"></a>
      <button class="nav-toggle" aria-label="Menu">☰</button>
      <div class="bc-links">
        <a href="index.html" data-page="home" data-i18n="nav.home"></a>
        <a href="play.html" data-page="play" data-i18n="nav.play"></a>
        <a href="learn.html" data-page="learn" data-i18n="nav.learn"></a>
        <a href="lab.html" data-page="lab" data-i18n="nav.lab"></a>
        <a href="tet.html" data-page="tet" data-i18n="nav.tet"></a>
      </div>
      <div class="nav-tools">
        <div class="lang-group" role="group" aria-label="Language">
          <button data-lang="vn" class="active">VN</button>
          <button data-lang="en">EN</button>
          <button data-lang="zh">ZH</button>
        </div>
        <button class="icon-btn" data-act="sound" data-i18n-aria="a11y.sound">🔊</button>
        <button class="coin-pill" data-act="drawer-open" data-i18n-aria="a11y.coin">🪙 1.000 xu</button>
      </div>
    </div>
  </nav>

  <main id="main">
    <section class="section">
      <div class="section-head">
        <span class="sticker red" data-i18n="play.title"></span>
        <h2 data-i18n="play.sub"></h2>
      </div>
      <div class="play-grid">
        <div>
          <div class="board" aria-label="Betting board"></div>
          <h3 style="margin:16px 0 0" data-i18n="play.chips"></h3>
          <div class="chip-tray"></div>
          <div class="play-actions">
            <button class="btn-bc btn-sm" data-act="undo" data-i18n="play.undo"></button>
            <button class="btn-bc btn-sm" data-act="clear" data-i18n="play.clear"></button>
            <button class="btn-bc btn-sm" data-act="rebet" data-i18n="play.rebet"></button>
          </div>
          <div class="bowl-zone">
            <div class="bowl" aria-hidden="true">🥣</div>
            <div class="dice-row" aria-live="polite"></div>
            <div class="status-line">…</div>
            <button class="btn-bc btn-gold btn-shake" data-act="shake" data-i18n="play.shake"></button>
          </div>
        </div>
        <div>
          <div class="card-bc">
            <h3 data-i18n="play.history"></h3>
            <div class="history-strip"></div>
          </div>
          <div class="card-bc leader">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
              <h3 data-i18n="lb.title"></h3>
              <span class="sticker red" data-i18n="lb.soon"></span>
            </div>
            <div class="podium" aria-hidden="true">
              <div class="step-bc p2">🥈<br>Cô Hoang</div>
              <div class="step-bc p1">🥇<br>Chú Tễu</div>
              <div class="step-bc p3">🥉<br>Bác Ba</div>
            </div>
            <table class="lb-table">
              <thead><tr><th data-i18n="lb.rank"></th><th data-i18n="lb.name"></th><th data-i18n="lb.xu"></th></tr></thead>
              <tbody id="lb-body"></tbody>
</table>
            <p class="sample-note mut" data-i18n="lb.sample"></p>
            <div class="lb-desc" data-i18n="lb.desc"></div>
          </div>
        </div>
      </div>
    </section></main>

  <footer class="bc-footer">
    <div class="inner">
      <div>
        <strong data-i18n="brand.full"></strong>
        <p class="fine" data-i18n="footer.blurb"></p>
      </div>
      <div class="fine">
        <p data-i18n="footer.warn"></p>
        <p data-i18n="footer.made"></p>
      </div>
      <div class="fine">
        <a href="index.html" data-i18n="nav.home"></a><br>
        <a href="play.html" data-i18n="nav.play"></a><br>
        <a href="learn.html" data-i18n="nav.learn"></a>
      </div>
    </div>
  </footer>

  <!-- animal detail modal -->
  <div class="modal-bc" id="modal-animal" role="dialog" aria-modal="true">
    <div class="box"></div>
  </div>

  <!-- Túi xu drawer -->
  <div class="drawer-backdrop"></div>
  <aside class="drawer" aria-label="Túi xu">
    <div class="close-row"><button class="icon-btn" data-act="drawer-close" aria-label="Close">✕</button></div>
    <h3>💰 <span data-i18n="drawer.title"></span></h3>
    <button class="btn-bc btn-red" data-act="lixi" style="width:100%" data-i18n="drawer.lixi"></button>
    <p class="mono mut" style="font-size:12px" data-i18n="footer.warn"></p>
    <h3 style="font-size:18px" data-i18n="drawer.badges"></h3>
    <div class="badge-grid" id="badge-grid"></div>
    <h3 style="font-size:18px" data-i18n="drawer.stats"></h3>
    <div id="drawer-stats" style="display:grid;gap:6px"></div>
    <button class="btn-bc btn-sm" data-act="reset" style="margin-top:14px" data-i18n="drawer.reset"></button>
  </aside>

  <button class="icon-btn" data-act="drawer-open" aria-label="Túi xu"
    style="position:fixed;bottom:18px;right:18px;z-index:150;width:56px;height:56px;font-size:24px;border-radius:50%">💰</button>
  <div class="toast-zone"></div>

  <script src="js/data-core.js"></script>
  <script src="js/data-content.js"></script>
  <script src="js/i18n-vn.js"></script>
  <script src="js/i18n-en.js"></script>
  <script src="js/i18n-zh.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/wallet.js"></script>
  <script src="js/badges.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game-core.js"></script>
  <script src="js/game.js"></script>
  <script src="js/page-home.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      BCUI.boot();
      BCGame.boot();
      var resetBtn = document.querySelector("[data-act=reset]");
      if (resetBtn) resetBtn.addEventListener("click", function () {
        BCStore.reset();
        BCUI.toast(BCi18n.t("drawer.resetOk"));
        setTimeout(function () { location.reload(); }, 600);
      });
    });
  </script>
</body>
</html>
